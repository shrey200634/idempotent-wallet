spring.application.name=idempotent-wallet

# Reads from environment variables / .env locally. Defaults kept safe so the
# test suite still runs zero-config even if no .env is present.
spring.datasource.url=${DB_URL:jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
